    <title>Calendario de Sorpresas 🌸</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdf2f8;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .contenedor {
            background-color: white;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 700px;
            margin: 30px auto;
        }
        h1 { color: #db2777; font-size: 28px; margin-bottom: 10px; }
        p.intro { color: #666; margin-bottom: 30px; font-size: 16px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }
        .dia-btn {
            background-color: #fce7f3;
            color: #be185d;
            border: none;
            padding: 18px 0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dia-btn:hover {
            transform: translateY(-3px);
            background-color: #fbcfe8;
        }
        .dia-25 {
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
            color: #831843;
            grid-column: span 5;
            font-size: 20px;
        }
        @media (max-width: 500px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .dia-25 { grid-column: span 3; }
        }
    </style>
</head>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const cajas = document.querySelectorAll(".dia-btn");
        const audio = document.getElementById("audioFondo");
        const ahora = new Date();
        const mesActual = fechaActual.getMonth(); // 7 es Agosto
        const diaActual = ahora.getDate();

        cajas.forEach(caja => {
          const diaCaja = parseInt(caja.getAttribute("data-dia"));

          if ((mesActual === 7 && diaActual >= diaCaja) || mesActual > 7) {
            caja.style.pointerEvents = "auto";
            caja.style.opacity = "1";

                audio.play().catch(error => {
                    console.log("El navegador bloqueó la reproducción:", error);
